syntax = "proto3";

// package rank;

// (旧RankType枚举 1~14 已删除: 旧14榜下线, 榜实例由服务器 RankBoard 配置表注册,
//  rank_type 字段统一为 int32, 取值 = 榜实例ID, 百位分段: 1xx竞速周 2xx竞速总
//  3xx摸金周 4xx摸金总 5xx古董周 6xx古董总, 同 sub_id 周总相差100)

// 排行项数据（玩家、宗门等）
message RankItemData {
    int64 id = 1;             				// 通用ID（玩家榜为uid，宗门榜为guild_id）
    string name = 2;           				// 名称（玩家榜为玩家名称，宗门榜为宗门名称）
    int32 avatar = 3;         				// 头像（玩家榜为玩家头像，宗门榜为宗门头像）
    int32 avatar_frame = 4;    				// 头像框（玩家榜为玩家头像框，宗门榜为宗门头像框）
    int32 guild_id = 5;             		// 所属宗门ID
    string guild_name = 6;      			// 所属宗门名称
    int64 value = 7;            			// 排行值
    map<string, string> extra_data = 8; 	// 额外数据
    int32 rank = 9;            				// 排名
    int64 update_time = 10;      			// 更新时间
    // 出战角色和鬼怪信息
    int32 character_id = 11;           		// 出战角色配置ID
    repeated int32 character_skins = 12; 	// 出战角色时装（数组）
    int32 ghost_id = 13;               		// 出战鬼怪配置ID
    int32 ghost_skin = 14;             		// 出战鬼怪时装
    // 宗门榜宗主信息
    string guild_leader = 15;            	// 宗主名称
    int32 gl_char_id = 16;              	// 宗主出战角色配置ID
    repeated int32 gl_char_skins = 17;  	// 宗主出战角色时装（数组）
    int32 gl_ghost_id = 18;             	// 宗主出战鬼怪配置ID
    int32 gl_ghost_skin = 19;           	// 宗主出战鬼怪时装
}

// 子榜信息
message SubRankInfo {
    int32 rank_id = 1;          // 子榜ID
    int64 create_time = 2;      // 创建时间
    int64 last_refresh_time = 3; // 上次刷新时间
}

// 排行榜类型信息
message RankTypeInfo {
    int32 rank_type = 1;         // 榜实例ID(RankBoard配置, 101+)
    string name = 2;            // 排行榜名称
    bool is_flow = 3;           // 是否为流动榜
    repeated SubRankInfo sub_ranks = 4; // 子榜列表
    int32 category = 5;         // 一级标签 1=鬼王竞速 2=摸金 3=古董(新三榜)
    int32 sub_id = 6;           // 二级标签: 鬼王章节ID/红古董ID, 摸金=0
    int32 window = 7;           // 统计窗口 1=周榜 2=总榜(赛季)
}

// 获取所有排行榜类型请求
message PBRankGetAllTypesReqCmd {
    int64 uid = 1;             // 玩家ID
}

// 获取所有排行榜类型响应
message PBRankGetAllTypesRspCmd {
    int32 code = 1;             // 错误码
    string error = 2;            // 错误信息
    int64 uid = 3;             // 玩家ID
    repeated RankTypeInfo types = 4; // 排行榜类型列表
}

// 排行榜数据
message RankData {
    int32 rank_id = 1;          // 排行榜ID
    int32 rank_type = 2;        // 排行榜类型
    bool is_flow = 3;           // 是否为流动榜
    repeated RankItemData rank_items = 4; // 排行项数据（玩家、宗门等）
    int64 create_time = 5;      // 创建时间
    int64 last_refresh_time = 6; // 上次刷新时间
}

// 获取排行榜请求
message PBRankGetInfoReqCmd {
    int64 uid = 1;             // 玩家ID
    int32 rank_type = 2;        // 排行榜类型
    int32 rank_id = 3;          // 排行榜ID（流动榜需要）
}

// 获取排行榜响应
message PBRankGetInfoRspCmd {
    int32 code = 1;             // 错误码
    string error = 2;            // 错误信息
    int64 uid = 3;             // 玩家ID
    repeated RankData rank_data = 4; // 排行榜数据
}

// (旧榜客户端直报协议 PBRankUpdateXxxReqCmd×7 已删除: 新三榜为服务端结算权威上报, 不接受客户端直报)

// 领取排行榜奖励请求
message PBRankGetRewardReqCmd {
    int64 uid = 1;             // 玩家ID
    int32 category = 2;         // 一级标签 1=鬼王竞速 2=摸金 3=古董(必填, 按标签聚合领奖)
}

// 排行榜奖励数据
message RankReward {
    int32 item_id = 1;          // 物品ID
    int32 count = 2;           // 数量
    string type = 3;             // 奖励类型
}

// 领取排行榜奖励响应
message PBRankGetRewardRspCmd {
    int32 code = 1;             // 错误码
    string error = 2;            // 错误信息
    int64 uid = 3;             // 玩家ID
    bool success = 4;            // 是否成功
    repeated RankReward reward = 5; // 奖励列表
    int32 category = 6;         // 本次领取的一级标签(新三榜路径回显)
    int32 best_rank = 7;        // 领奖所用的最优名次(新三榜路径回显)
}

// 上期锁榜快照单条(领奖弹窗展示"上周排名"用; 领取后快照移除, 该查询返回空)
message BoardHistoryItem {
    int32 rank_type = 1;        // 榜实例ID
    int32 sub_id = 2;           // 二级标签(鬼王章节ID/红古董ID/0)
    int32 window = 3;           // 1=周榜 2=总榜
    int32 sub_rank_id = 4;      // 所在卷ID
    int32 rank = 5;             // 上期名次(并列同名次)
    int64 value = 6;            // 上期成绩
    int32 period = 7;           // 期数
}

// 查询上期锁榜排名(按一级标签聚合该标签下所有子榜)
message PBRankGetBoardHistoryReqCmd {
    int64 uid = 1;             // 玩家ID
    int32 category = 2;         // 一级标签 1=鬼王竞速 2=摸金 3=古董
}

message PBRankGetBoardHistoryRspCmd {
    int32 code = 1;             // 错误码
    string error = 2;            // 错误信息
    int64 uid = 3;             // 玩家ID
    int32 category = 4;         // 一级标签
    repeated BoardHistoryItem items = 5; // 上期各子榜名次(未上榜/已领取为空)
}

// 测试命令(仅测试环境): 驱动新三榜上报入口 / 触发榜期刷新
message PBTestRankBoardSettleReqCmd {
    int64 uid = 1;             // 玩家ID
    int32 kind = 2;            // 1=鬼王竞速 2=摸金 3=古董鉴定 9=触发周榜刷新 10=触发总榜(赛季)刷新
    int32 sub_id = 3;          // 竞速:鬼王ID 古董:红古董ID 摸金:0
    int32 clear_time = 4;      // 竞速:通关用时(秒)
    int64 value = 5;           // 摸金:战利品估值 古董:鉴定价值
    int32 times = 6;           // 重复次数(默认1, 上限100, 用于SUM累加测试)
    int32 chapter_id = 7;      // 竞速:章节ID(默认2001)
    repeated int32 tags = 8;   // 竞速:本局词条ID列表(默认{3000007}=7分; 传空数组=模拟未开词条不计入)
}

message PBTestRankBoardSettleRspCmd {
    int32 code = 1;             // 错误码
    string error = 2;            // 错误信息
    int64 uid = 3;             // 玩家ID
    int32 applied = 4;          // 实际执行次数
}