syntax = "proto3";

message PBConditionData
{
	int32 cond_id		= 1;
	int64 target_value	= 2;
	int64 now_value		= 3;
	int32 is_complete	= 4;
	repeated int32 params	= 5;
	repeated int32 arr_params	= 6;
}

message PBMissionData
{
    int32 mission_id	= 1;
    int32 mission_type	= 2;
	int32 mission_state	= 3;
	int64 beg_ts		= 4;
	int64 end_ts		= 5;
	repeated PBConditionData cond_datas = 6;
}

message PBLinearMissionInfo
{
	int64 last_check_ts = 1;
	map<int32, PBMissionData> now_mission_datas	= 2;
	map<int32, int32> complete_ids	= 3;
	map<int32, PBMissionData> wait_beg_mission_datas	= 4;
}

message PBPeriodMissionInfo
{
	int64 last_update_ts	= 1;
	map<int32, PBMissionData> now_day_mission_datas	= 2;
	map<int32, int32> complete_day_ids	= 3;
	map<int32, PBMissionData> now_week_mission_datas	= 4;
	map<int32, int32> complete_week_ids	= 5;
	map<int32, PBMissionData> now_month_mission_datas	= 6;
	map<int32, int32> complete_month_ids	= 7;
}

message PBAchivementMissionInfo
{
	map<int32, PBMissionData> now_mission_datas	= 1;
	map<int32, int32> complete_ids	= 2;
	int32 total_vitality = 3;				// 累计成就点
	map<int32, int32> got_award_ids	= 4;	// 已领取的成就点奖励档位id -> 领取时间戳
}

message PBActivityMissionInfo
{
	int64 last_update_ts	= 1;
	map<int32, PBMissionData> now_mission_datas	= 2;
	map<int32, int32> complete_ids	= 3;
}

message PBPlayerMissionInfo
{
	PBLinearMissionInfo linear_info	= 1;
	PBPeriodMissionInfo period_info	= 2;
	PBAchivementMissionInfo achivement_info	= 3;
	PBActivityMissionInfo activity_info	= 4;
}

// 更新任务进度 通知玩家
message PBUpdateMissionSyncCmd
{
    map<int32, PBMissionData> update_mission_datas	= 1;
	map<int32, int32> update_complete_ids	= 2;
	PBPeriodMissionInfo update_period_info	= 3;
	PBActivityMissionInfo update_activity_info	= 4;
	map<int32, int32> update_total_vitality	= 5;	// 点数变化时同步(仅变化时携带): 点数类型 -> 当前累计点数
}

message PBGetPlayerMissionInfoReqCmd
{
	int64 uid	= 1;
}

message PBGetPlayerMissionInfoRspCmd
{
	int32 code = 1; // 服务器返回,0成功,其他失败
    string error = 2; // 错误信息
    // 协议数据
    int64 uid				= 3;
	PBPlayerMissionInfo	player_mission_info	= 4;
}

message PBGetMissionRewardReqCmd
{
	int64 uid	= 1;
	repeated int32 linear_ids	= 2;
	repeated int32 period_ids	= 3;
	repeated int32 achivement_ids	= 4;
	repeated int32 activity_ids	= 5;
}

message PBGetMissionRewardRspCmd
{
	int32 code = 1; // 服务器返回,0成功,其他失败
    string error = 2; // 错误信息
    // 协议数据
    int64 uid				= 3;
	repeated int32 linear_ids	= 4;
	repeated int32 period_ids	= 5;
	repeated int32 achivement_ids	= 6;
	repeated int32 activity_ids	= 7;
}

message PBRrefreshMissionReqCmd
{
	int64 uid	= 1;
	int32 old_mission_id	= 2;
}

message PBRrefreshMissionRspCmd
{
	int32 code = 1; // 服务器返回,0成功,其他失败
    string error = 2; // 错误信息
    // 协议数据
    int64 uid				= 3;
	PBMissionData new_mission_data	= 4;
	int32 new_complete_id	= 5;
}

// 领取点数(成就点/活跃点)达标奖励 通用协议
message PBGetVitalityAwardReqCmd
{
	int64 uid = 1;
	int32 vitality_type = 2;		// 点数类型: 1成就点 2线性任务活跃点 3周期任务活跃点 4活动任务活跃点
	repeated int32 award_ids = 3;	// 对应类型奖励配置表档位id(当前成就点为AchievementAward表)
}

message PBGetVitalityAwardRspCmd
{
	int32 code = 1; // 服务器返回,0成功,其他失败
    string error = 2; // 错误信息
    // 协议数据
    int64 uid = 3;
	int32 vitality_type = 4;		// 回显点数类型
	repeated int32 award_ids = 5;	// 本次领取成功的档位id
	int32 total_vitality = 6;		// 领取后的该类型累计点数
}