syntax = "proto3";
import "common.proto";
import "item.proto";
import "user.proto";
import "bag.proto";
import "role.proto";
import "gods.proto";
import "aweitem.proto";

message PBGameChangeRoleInfo
{
    int32 roleid   = 1;
    int32 add_role_exp  = 2;    //角色经验变化
    map<int64, int32> magic_item_durability   = 3;	//法器耐久值
    map<int64, int32> digrams_cards_durability	= 4;	//八卦牌耐久值
    map<int64, int32> space_ring_durability	= 5;	//空间戒指耐久值
    map<int32, int32> magic_item_exp    = 6;    //法器增加经验
    map<int32, int32> digrams_cards_exp = 7;    //八卦牌增加经验
    map<int32, int32> space_ring_exp = 8;       //空间戒指增加经验
}

message PBInGameKillMonster
{
    int32 monster_id    = 1;
    int32 monster_type  = 2;
    int32 kill_cnt      = 3;
}

message PBDsUseItemInfo
{
    int32 config_id     = 1;
    int32 item_count    = 2;
    int32 cur_durability    = 3;
}

// DS结算数据
message PBGameSettle
{
    string settle_data = 1;//战报详情
    int32 account_experience = 2;//账户经验值
    repeated PBGameChangeRoleInfo game_role_change = 3;//角色信息变更
    PBBag consume_bag   = 4;//消耗品背包
    PBBag booty_bag     = 5;//战利品背包    --废弃
    PBBag tool_bag      = 6;//工具品背包
    int32 grade_id      = 7;//段位
    int32 change_score  = 8;//段位积分
    repeated PBItemSimple reward_boxs   = 9;//获得的奖励宝箱
    map<int32, int32> game_missions  = 10;   // 局内完成任务
    repeated PBInGameKillMonster kill_monsters  = 11;   // 局内击杀怪物
    int32 chapter_id    = 12;    // 章节id
    int32 difficulty    = 13;    // 难度
    repeated int32 battle_god_ids   = 14;    //参战神明id
    int64 booty_value   = 15;   // 战利品总价值
    string settle_simple_data = 16;//战报简述
    int64 start_game_ts = 17;   // 游戏开始时间戳(秒级)
    int64 end_game_ts = 18;   // 游戏结束时间戳(秒级)
    int32 is_complete   = 19;   // 完成率/通关率/撤离率
    map<int32, PBCoin>  booty_coins = 20;   //局内获得的货币类战利品
    map<int32, int64>   booty_items = 21;   //局内获得的道具战利品
    repeated PBDsUseItemInfo booty_use_items    = 22;   //局内获得的使用过道具战利品
}

// 玩家进入主城
message PBEnterCityReqCmd
{
    int64 uid		= 1;
    int32 cityid    = 2;
}

message PBEnterCityRspCmd
{
    int32 code      = 1; // 服务器验证返回,0成功,其他失败
    string error    = 2; // 错误信息
}

// 玩家退出主城
message PBExitCityReqCmd
{
    int64 uid		= 1;
    int32 cityid    = 2;
}

message PBExitCityRspCmd
{
    int32 code      = 1; // 服务器验证返回,0成功,其他失败
    string error    = 2; // 错误信息
}

// 主城信息同步
message PBUpdateCityReqCmd
{
    int32 cityid		= 1;
    int32 player_num    = 2;
}

message PBUpdateCityRspCmd
{
    int32 code      = 1; // 服务器验证返回,0成功,其他失败
    string error    = 2; // 错误信息
}

// 给玩家添加道具
message PBAddItemsCityPlayerReqCmd
{
    int64 uid		= 1;
    int32 cityid    = 2;
    repeated PBItemSimple simple_items = 3;
}

message PBAddItemsCityPlayerRspCmd
{
    int32 code      = 1; // 服务器验证返回,0成功,其他失败
    string error    = 2; // 错误信息
}

// DS获取玩家账号数据
message PBGetDsUserAttrReqCmd
