// DS通知玩家已进入副本
message PBDsNotifyPlayerEnterReqCmd
{
    int64 roomid    = 1;
    repeated int64 uids = 2;
}

message PBDsNotifyPlayerEnterRspCmd
{
    int32 code			= 1; // 服务器验证返回,0成功,其他失败
    string error		= 2; // 错误信息
    int64 roomid    = 3;
    repeated int64 uids = 4;
}

// DS通知玩家已退出副本
message PBDsNotifyPlayerExitReqCmd
{
    int64 roomid    = 1;
    int64 uid       = 2;
    int32 need_settle   = 3;    //是否结算 0--否 1--是
    PBGameSettle player_settle  = 4;    //结算数据
}

message PBDsNotifyPlayerExitRspCmd
{
    int32 code			= 1; // 服务器验证返回,0成功,其他失败
    string error		= 2; // 错误信息
    int64 roomid    = 3;
    int64 uid       = 4;
}

// DS通知副本已结束
message PBDsNotifyPlayEndReqCmd
{
    int64 roomid    = 1;
    int32 need_settle   = 2;    //是否结算 0--否 1--是
    map<int64, PBGameSettle> players_settle  = 3;    //结算数据
}

message PBDsNotifyPlayEndRspCmd
{
    int32 code			= 1; // 服务器验证返回,0成功,其他失败
    string error		= 2; // 错误信息
    int64 roomid    = 3;
}

